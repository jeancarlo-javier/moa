# .moa.yml — lite-build
# Small build pipeline: planner → coder → validate. No plan-review gate.
# Use for low-risk, well-scoped changes where the plan is small enough to skip review.
# For risky or cross-cutting work prefer full-engineering.
schemaVersion: 1

template:
  base: engineering
  projectType: auto

# Init writes ONLY aliases selected by roles, never the full live inventory.
# Each entry uses a canonical provider/model id. Optional `binding` pins that model to
# `host-native` or one learned tool; roles select aliases through `use` and never pin tools.
models: {}

master:
  mode: auto                   # may right-size non-gate phases (plan) for small changes;
                               # the validate gate + producer-independent verifier still hold
  selfCertification: forbidden
  hardVerificationTags: [strong]

roles:
  planner:
    use: [auto]
    instructions: |
      Produce an executable task graph: changed files, declared write-sets, edge
      cases, and the exact verification commands the validator will run.

  coder:
    use: [auto]
    instructions: |
      Implement only the files declared in the plan. Stay within the declared
      write-set; reject yourself rather than touch anything outside it.

  verifier:
    use: [auto]
    differentModelFrom: coder
    instructions: |
      Run the planner's verification commands in the project directory and check the
      phase-local delta against the done-criteria — not the run's cumulative diff.
      Independent of the coder (a different model).

pipelines:
  build:
    steps:
      - { phase: frame,    role: master }
      - { phase: plan,     role: planner, skippable: true }
      - { phase: execute,  role: coder, loopBackTo: plan }
      - { phase: validate, role: verifier, gate: critical, loopBackTo: execute }
      - { phase: finalize, role: master }
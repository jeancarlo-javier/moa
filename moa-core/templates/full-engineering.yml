# .moa.yml — full-engineering
# Two pipelines: engineering (7-phase canonical) and quick (5-phase lean).
# Gates: review-plan(standard), review-work(standard), validate(critical). Plan-reviewer
# and code-reviewer use differentModelFrom to keep reviews independent. Verifier is critical
# and a different model than the coder (different family preferred). Pick engineering for real mutation risk;
# quick for low-risk, well-scoped changes that still need a critical validate gate.
schemaVersion: 1

template:
  base: engineering
  projectType: auto

runtime:
  defaults:
    maxGateLoops: 2

# Init writes ONLY aliases selected by roles, never the full live inventory.
# Each entry uses a canonical provider/model id. Optional `binding` pins that model to
# `host-native` or one learned tool; roles select aliases through `use` and never pin tools.
models: {}

master:
  mode: auto                   # right-sizes non-gate phases; gate floor is absolute
  selfCertification: forbidden
  hardVerificationTags: [strong]

roles:
  planner:
    use: [auto]             # init pins best fit → strong (reasoning-heavy)
    instructions: |
      Produce an executable task graph: changed files, declared disjoint write-sets
      per coder, edge cases, and the exact verification commands the validator runs.

  plan-reviewer:
    use: [auto]
    differentModelFrom: planner
    instructions: |
      Independently review the plan for correctness, missing edge cases, and an
      over-broad write-set. APPROVE only when the plan is executable as-is.

  coder:
    use: [auto]             # init pins best fit → cheap/smol (high-volume)
    instructions: |
      Implement only the files in your declared write-set. If a needed write is
      outside it, stop and surface it instead of expanding scope silently.

  code-reviewer:
    use: [auto]
    differentModelFrom: coder
    instructions: |
      Compare the diff to the plan and done-criteria. Flag scope creep, missing
      tests, and any write outside the declared write-set.

  verifier:
    use: [auto]             # init pins a strong, coder-independent model (gate floor)
    differentModelFrom: coder
    instructions: |
      Run the planner's verification commands in the project directory and confirm the
      framed done-criteria against the phase-local delta. Independent of the coder
      (a different model).

pipelines:
  engineering:
    description: Full 7-phase flow with plan-review and code-review gates; for non-trivial features, refactors, and migrations with real mutation risk.
    steps:
      - { phase: frame,       role: master }
      - { phase: plan,        role: planner, skippable: true }
      - { phase: review-plan, role: plan-reviewer, gate: standard, loopBackTo: plan }
      - { phase: execute,     role: coder, fanout: byDisjointWriteSet, loopBackTo: plan }
      - { phase: review-work, role: code-reviewer, gate: standard, loopBackTo: execute }
      - { phase: validate,    role: verifier, gate: critical, loopBackTo: execute }
      - { phase: finalize,    role: master }

  quick:
    description: Lean 5-phase flow (no review gates) with a critical validate gate; for low-risk, well-scoped changes.
    steps:
      - { phase: frame,    role: master }
      - { phase: plan,     role: planner, skippable: true }
      - { phase: execute,  role: coder, loopBackTo: plan }
      - { phase: validate, role: verifier, gate: critical, loopBackTo: execute }
      - { phase: finalize, role: master }
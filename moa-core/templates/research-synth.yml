# .moa.yml — research-synth
# Two-stage research: a fast gatherer collects cited facts, a strong synthesizer
# turns them into a written artifact. Ends with a validate gate for synthesis quality.
# Use for write-ups, briefings, and analyses that summarize external evidence.
schemaVersion: 1

template:
  base: research
  projectType: auto

# Init writes ONLY aliases selected by roles, never the full live inventory.
# Each entry uses a canonical provider/model id. Optional `binding` pins that model to
# `host-native` or one learned tool; roles select aliases through `use` and never pin tools.
models: {}

master:
  selfCertification: forbidden
  hardVerificationTags: [strong]

roles:
  gatherer:
    use: [auto]
    tools: web_research
    instructions: |
      Collect cited facts only — no synthesis, no prose. Emit a research-facts.json
      with claim/source/quote/confidence/relevance per item. Raw pages stay out of
      write-capable roles.

  synthesizer:
    use: [auto]
    tools: repo_read_only
    instructions: |
      Turn the typed research-facts.json into the requested artifact. Cite every
      non-trivial claim to its source row; do not invent evidence the facts do not
      support.

  verifier:
    use: [auto]
    tools: verify_test
    differentModelFrom: synthesizer
    instructions: |
      Independently check that every claim in the artifact traces to a row in
      research-facts.json and that no invented evidence slipped in.

pipelines:
  research:
    steps:
      - { phase: frame,      role: master }
      - { phase: gather,     role: gatherer }
      - { phase: synthesize, role: synthesizer }
      - { phase: validate,   role: verifier, gate: critical }
      - { phase: finalize,   role: master }